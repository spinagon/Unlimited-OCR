[project]
name = "unlimited-ocr-2"
version = "0.1.0"
description = "Baidu Unlimited-OCR-2 document OCR model"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "torch>=2.1.0",
    "torchvision",
    "transformers==4.52.1",
    "tokenizers==0.21.4",
    "huggingface-hub>=0.36.0",
    "accelerate>=1.0.0",
    "pymupdf>=1.24.0",
    "fastokens==0.3.2",
    "einops>=0.8.0",
    "addict==2.4.0",
    "easydict==1.13",
    "triton>=3.0.0",
    "pybase64>=1.4.0",
    "starlette>=0.38.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "ipython>=8.0.0",
    "openai>=1.50.0",
    "psutil>=6.0.0",
    "requests>=2.28.0",
    "dill>=0.3.8",
    "orjson>=3.10.0",
    "msgspec>=0.18.0",
    "distro>=1.9.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
